# Projekt-lokale GitHub CLI-Auth (.git_local/gh-cli/hosts.yml)
#
# GH_CONFIG_DIR zeigt auf dieses Verzeichnis.
# Host, Token und Protokoll pro Projekt/Kunde anpassen.
#
# Token erzeugen: GitHub -> Settings -> Developer settings -> Personal access tokens
# Benoetigte Scopes: repo, read:org, workflow

github.com:
  oauth_token: ghp_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
  git_protocol: https
