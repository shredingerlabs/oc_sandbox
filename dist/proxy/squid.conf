# Minimaler Egress-Allowlist-Proxy für die OpenCode-Coding-Sandbox (Zone 1).
# Nur Domains aus allowlist.txt werden erlaubt, alles andere wird geblockt.

http_port 3128

acl allowed_domains dstdomain "/etc/squid/allowlist.txt"
acl SSL_ports port 443
acl CONNECT method CONNECT

# CONNECT (HTTPS-Tunnel) nur zu erlaubten Domains auf Port 443
http_access deny CONNECT !SSL_ports
http_access allow CONNECT allowed_domains
http_access allow allowed_domains

# Alles andere ablehnen
http_access deny all

# --- Rootless-Container-Betrieb (per-Pod-Member unter --userns=keep-id) ------
# Squid darf nichts ins image-eigene Rootfs schreiben: /var/run und
# /var/log/squid sind je nach Host-Mounts/Mapping nicht schreibbar und squid
# stirbt dann beim Start (z.B. "FATAL: failed to open /var/run/squid.pid:
# (13) Permission denied"). Kein Pid-File (der Container hat garantiert
# genau einen Prozess, und podman start wuerde sonst eine stale PID-Datei
# finden), kein Pinger-Kindprozess, alle Logs über stdio — sie landen in
# `podman logs` des oc-proxy-Members.

pid_filename none
pinger_enable off
logfile_rotate 0
access_log stdio:/dev/stdout squid
cache_log stdio:/dev/stderr
cache_store_log none

# Kein Caching von sensiblen/Auth-Requests, schlankes Logging
cache deny all
