function deriveName(url) {
  url = (url || '').trim().replace(/\/+$/, '');
  if (!url) return '';
  const m = url.match(/([^\/:]+)\.git\/?$/i);
  if (m) return m[1];
  const parts = url.split(/[\/:]/).filter(Boolean);
  return parts[parts.length - 1] || '';
}

  'set-config':   'Export / Restore Config',

let S = null; // { variant, theme, display, screen }
function parseHash() {
  const h = location.hash.replace(/^#/, '').split('/');
  return {
    variant: VARIANTS.includes(h[0]) ? h[0] : 'a',
    theme: h[1] === 'dark' ? 'dark' : 'bright',
    display: h[2] === 'std' ? 'std' : 'adv',
    screen: SCREENS[h[3]] ? h[3] : 'ws-open',
  };
}
function go(delta) {
  const i = VARIANTS.indexOf(S.variant);
  S.variant = VARIANTS[(i + delta + VARIANTS.length) % VARIANTS.length];
  writeHash();
}
function writeHash() {
  location.hash = `#${S.variant}/${S.theme}/${S.display}/${S.screen}`;
}
const adv = () => S.display === 'adv';
const chip = (cls, txt) => `<span class="chip ${cls}">${txt}</span>`;

/* ============================== modal ============================== */
function modal(title, body, okLabel, dangerFn) {
  const root = document.getElementById('modalRoot');
  root.hidden = false;
  root.innerHTML = `
  <div class="overlay" data-close="1">
    <div class="modal" role="dialog" aria-modal="true">
      <h3>${icons.warn} ${title}</h3>
      <p>${body}</p>
      <div class="actions">
        <button class="btn ghost" close-modal>Cancel</button>
        <button class="btn ${dangerFn?'danger solid':'primary'}" id="modalOk">${okLabel}</button>
      </div>
    </div>
  </div>`;
  root.querySelector('[data-close]').onclick = closeModal;
  root.querySelector('[close-modal]').onclick = closeModal;
  root.querySelector('#modalOk').onclick = () => { closeModal(); if (dangerFn) dangerFn(); };
}
function closeModal() {
  const root = document.getElementById('modalRoot');
  root.hidden = true; root.innerHTML = '';
}

        <div class="ic" style="color:var(--danger)">${icons.trash}</div>
        <div class="rl"><div class="t" style="color:var(--danger)">Remove workspace</div>
          <div class="s">Unregisters the workspace; container and folders stay. Real deletion is the container-flow job.</div></div>
        <div class="rc"><button class="btn danger-ghost">Remove…</button></div></div>
    </div>`;
  },

  'set-vcs'() {
    const rows = VCS.map(v => `
      <div class="row"><div class="ic" style="${v.status==='expired'?'color:var(--danger)':''}">${icons.branch}</div>
        <div class="rl"><div class="t" style="${v.status==='expired'?'':'font-weight:600'}">${v.name}</div>
          <div class="s">${v.auth}</div></div>
        <div class="rc">${v.status==='ok'?chip('ok',`<span class="dot2"></span> authenticated`):chip('bad',`<span class="dot2"></span> expired — re-login`)}
          <button class="btn ghost">Edit</button></div></div>`).join('');
    return `
    <div class="pagehead"><div>
      <h2 style="font-size:15px;margin-bottom:4px">VCS tracker credentials</h2>
      <div class="desc">Global list. Workspaces reuse these credentials for clone/push; one credential per named host identity.</div>
    </div>
    <button class="btn">${icons.plus} Add credential</button></div>
    <div class="panel">${rows}</div>`;
  },

  'set-ai'() {
    const rows = PROVIDERS.map(p => `
      <div class="row"><div class="ic">${icons.spark}</div>
        <div class="rl"><div class="t">${p.name}${p.legacy?' <span class="chip warn">legacy entry</span>':''}</div>
          <div class="s mono">${p.url} — ${p.credential}</div></div>
        <div class="rc">${p.status==='ok'?chip('ok',`<span class="dot2"></span> ready`):chip('bad',`<span class="dot2"></span> ${p.credential}${p.legacy?' · read-only':''}`)}
          <button class="btn ghost"${p.legacy?' title="legacy: entries lacking a credential render read-only" disabled':''}>Edit</button></div></div>`).join('');
    return `
    <div class="pagehead"><div>
      <h2 style="font-size:15px;margin-bottom:4px">AI providers</h2>
      <div class="desc">OpenAI-compatible endpoints any workspace can select. Which provider's models run is chosen inside OpenCode, not here.</div>
    </div>
    <button class="btn">${icons.plus} Add provider</button></div>
    <div class="panel">${rows}</div>`;
  },

  'set-import'() {
    return `
    <div class="pagehead"><div>
      <h2 style="font-size:15px;margin-bottom:4px">Import a workspace</h2>
      <div class="desc">Bring an exported workspace (config + registry entry${adv()?', sandbox_config.json':''}) back, or adopt an existing folder without re-running init.</div>
    </div></div>
    <div class="drop" style="max-width:640px">
      ${icons.upload}<div class="big">Drop the workspace export here</div>
      <div>or</div>
      <div style="margin-top:8px"><button class="btn ghost">Browse…</button></div>
    </div>
    <div class="panel" style="margin-top:16px;max-width:640px"><div class="row">
      <div class="ic">${icons.check}</div>
      <div class="rl"><div class="t">What gets imported</div>
        <div class="s">workspace name &amp; edition${adv()?' · modes · start option':''} · registered VCS link · provider selection. Credentials are <b>not</b> carried — re-link at first open.</div></div></div></div>`;
  },

  'set-update'() {
    return `
    ${bannerRow(`${icons.update} An update is available — the same banner lives in the <b>footer of every page</b> (your current footer at the bottom of this screen is the real thing). <button class="btn" style="margin-left:6px">Open Update</button>`)}
    <div class="pagehead"><div>
      <h2 style="font-size:15px;margin-bottom:4px">Update oc_sandbox</h2>
      <div class="desc">The host serves everything from dist/ — an update swaps dist/ and restarts the WebUI service.</div>
    </div></div>
    <div class="panel" style="max-width:720px">
      <div class="row"><div class="ic">${icons.box}</div>
        <div class="rl"><div class="t">Current version</div><div class="s mono">v0.9.3 · installed via install script · WebUI from dist/</div></div>
        <div class="rc"><button class="btn ghost">Check now</button></div></div>
      <div class="row"><div class="ic">${icons.update}</div>
        <div class="rl"><div class="t">Latest release</div>
          <div class="s">v1.0.0 — WebUI as main UI · Workspace rename with migration · always-on OpenCode web access</div>
          <div class="prog" style="margin-top:9px;max-width:320px"><i></i></div>
          <div class="s mono" style="margin-top:5px;color:var(--ink2)">downloading dist bundle… 38%</div></div>
        <div class="rc"><button class="btn">${icons.download} Update</button></div></div>
      <div class="row"><div class="ic">${icons.warn}</div>
        <div class="rl"><div class="t">During the update</div><div class="s">self-update behavior (browser usability mid-update, server restart) is <b>deliberately unresolved</b> — see the map's "Not yet specified".</div></div></div>
    </div>`;
  },

  'set-config'() {
    return `
    <div class="pagehead"><div>
      <h2 style="font-size:15px;margin-bottom:4px">Configuration export &amp; restore</h2>
      <div class="desc">One file carrying the global config: registry${adv()?', display mode,':''} credentials locations, provider list, tracker list.</div>
    </div></div>
    <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(300px,1fr))">
      <div class="bigtile"><span class="bt-t"><i>${icons.download}</i>Export config</span>
        <span class="bt-d">Saves oc_sandbox config as JSON. Workspace folders and containers stay untouched — move workspaces with <b>Import Workspace</b>.</span>
        <div><button class="btn">${icons.download} Export…</button></div></div>
      <div class="bigtile"><span class="bt-t"><i style="--bt:#e8721c">${icons.upload}</i>Restore config</span>
        <span class="bt-d">Overwrites the current config from a file. A safety copy of the live config is kept next to it (config.json.bak).</span>
        <div><button class="btn ghost">Choose file…</button></div></div>
    </div>`;
  },

  'set-images'() {
    const rows = IMAGES.map(im => {
      const e = ED[im.id];
      return `<div class="row" ${im.exists?'':`style="opacity:.78"`}>
        <div class="ic" style="color:#fff;background:${e.hue}">${e.letter}</div>
        <div class="rl"><div class="t">${e.label}</div>
          <div class="s mono">opencode-sandbox-${im.id} · ${im.exists?'image present · 412 MB':'image missing — build to use'}</div></div>
        <div class="rc">${chip(im.exists?'ok':'neutral', im.exists?'installed':'missing')}
          <button class="btn ghost" ${im.exists?'disabled':''}>${icons.play} Build</button>
          <button class="btn danger-ghost" ${im.exists?'':'disabled'}>${icons.trash} Delete</button></div></div>`;
    }).join('');
    return `
    <div class="pagehead"><div>
      <h2 style="font-size:15px;margin-bottom:4px">Container images</h2>
      <div class="desc">Edition images from the Dockerfile stage registry (runtime detection). Delete is a confirm-dialog action like container delete.</div>
    </div>
    <button class="btn ghost">${icons.update} Re-check runtime</button></div>
    <div class="panel">${rows}</div>`;
  },

  'set-containers'() {
    const rows = CONTAINERS.map(c => {
      const e = ED[c.edition];
      return `<div class="row"><div class="ic" style="color:#fff;background:${e.hue}">${e.letter}</div>
        <div class="rl"><div class="t">${c.id}</div>
          <div class="s mono">${e.label} · port ${c.running ? c.port : 'not listening'}</div></div>
        <div class="rc">${c.running?chip('ok',`<span class="dot2"></span> running`):chip('neutral','stopped')}
          ${c.running
            ? `<button class="btn ghost" data-stop="${c.id}">${icons.stop} Stop</button>`
            : `<button class="btn ghost">${icons.play} Start</button>`}
          <button class="btn danger-ghost" data-del="${c.id}">${icons.trash} Delete</button></div></div>`;
    }).join('');
    return `
    <div class="pagehead"><div>
      <h2 style="font-size:15px;margin-bottom:4px">Container center</h2>
      <div class="desc">One list, three actions. Stop and delete confirm <b>always</b> — a stopped container is never killed, a delete never silent.</div>
    </div>
    <button class="btn ghost">${icons.update} Refresh</button></div>
    <div class="panel">${rows}</div>`;
  },

  'set-uninstall'() {
    return `
    <div class="pagehead"><div>
      <h2 style="font-size:15px;margin-bottom:4px">Uninstall</h2>
      <div class="desc">Removes oc_sandbox itself: images, WebUI service, install folder, bin entry.</div>
    </div></div>
    <div class="panel dangerzone" style="max-width:680px;border:1.5px solid var(--danger)">
      <div class="row"><div class="ic" style="color:var(--danger)">${icons.warn}</div>
        <div class="rl"><div class="t" style="color:var(--danger)">What is removed</div>
          <div class="s">container images · WebUI service &amp; binary · install folder. <b>Workspace folders</b> stay unless you tick them below (they're your work).</div></div></div>
      <div class="row"><div class="ic">${icons.trash}</div>
        <div class="rl"><div class="t">Also delete workspace folders</div><div class="s">Irrecoverable. Default: keep.</div></div>
        <div class="rc"><button class="switch"></button></div></div>
      <div class="row"><div class="rl"></div>
        <div class="rc"><button class="btn danger solid" onclick="modal('Uninstall oc_sandbox?','This removes images, WebUI service, bin entry and the install folder. Workspace folders stay unless you enabled deletion above. This cannot be undone.','Uninstall',()=>{})">${icons.trash} Uninstall…</button></div></div>
    </div>`;
  },
};
function bannerRow(inner) { return `<div class="bannerrow">${inner}</div>`; }

/* ============================== events ============================== */
document.addEventListener('click', (ev) => {
  const t = ev.target.closest('button');
  if (!t) return;
  if (t.id === 'themeBtn') { S.theme = S.theme === 'dark' ? 'bright' : 'dark'; writeHash(); render(); return; }
  if (t.dataset.setws) setWsSel = t.dataset.setws;
  if (t.dataset.nav) { S.screen = t.dataset.nav; document.getElementById('sidebar').scrollTop = 0; writeHash(); render(); return; }
  if (t.dataset.newtype) { UI.newType = t.dataset.newtype; render(); return; }
  if (t.dataset.mode) { S.display = t.dataset.mode; writeHash(); render(); return; }
  if (t.dataset.stop) { modal(`Stop “${t.dataset.stop}”?`, `The workspace container will shut down. Unsaved agent sessions end with it — OpenCode is stopped, not killed.`,'Stop container', ()=>{}); return; }
  if (t.dataset.del) { modal(`Delete “${t.dataset.del}”?`, `Removes the container${adv()?' (and pod when pod networking is active)':''} and unregisters the workspace. Workspace folders are kept.`,'Delete container', ()=>{}); return; }
  if (t.dataset.fold) {
    const sec = t.closest('section');
    sec.classList.toggle('open');
    sec.querySelector('ul').hidden = !sec.classList.contains('open');
    return;
  }
  if (t.closest('.switch')) t.setAttribute('aria-pressed', t.getAttribute('aria-pressed') !== 'true');
  if (t.closest('.edotsel')) {
    [...t.parentElement.children].forEach(b => b.setAttribute('aria-pressed', 'false'));
    t.setAttribute('aria-pressed', 'true');
  }
});
document.getElementById('pPrev').onclick = () => go(-1);
document.getElementById('pNext').onclick = () => go(1);
document.getElementById('pTheme').onclick = () => { S.theme = S.theme === 'dark' ? 'bright' : 'dark'; writeHash(); render(); };
document.getElementById('pDisplay').onclick = () => { S.display = S.display === 'adv' ? 'std' : 'adv'; writeHash(); render(); };
document.addEventListener('keydown', (ev) => {
  if (['INPUT','TEXTAREA'].includes(document.activeElement?.tagName) || document.activeElement?.isContentEditable) return;
  if (ev.key === 'ArrowLeft') go(-1);
  if (ev.key === 'ArrowRight') go(1);
});
window.addEventListener('hashchange', () => { const n = parseHash();
  if (n.variant !== S.variant || n.screen !== S.screen || n.theme !== S.theme || n.display !== S.display) { S = n; render(); } });

S = parseHash();
render();
</script>
</body>
</html>
